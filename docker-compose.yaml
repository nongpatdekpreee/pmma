version: '3.8'

services:
  # =============================================
  # MySQL Database
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: tccstock_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  # =============================================
  # App (Backend 3000 + Frontend 80)
  # =============================================
  app:
    image: 10.4.102.212:8080/tccstock-app:1
    container_name: tccstock_app
    restart: unless-stopped
    expose:
      - "3000"
      - "80"
    environment:
      NODE_ENV: production
      # Backend (ตรงกับ config/database.js)
      PORT_BACKEND: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
      # Frontend
      PORT_FRONTEND: 80
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_NETBOX_BASE_URL: http://10.4.102.212:9000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  # =============================================
  # Nginx Reverse Proxy
  # =============================================
  nginx:
    image: nginx:latest
    container_name: tccstock_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - app-net

  # =============================================
  # phpMyAdmin
  # =============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tccstock_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "7000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    external: true
