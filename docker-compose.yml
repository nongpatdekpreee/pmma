services:
  backend:
    image: 10.4.102.212:8080/pmma-plan-backend:latest
    container_name: pmma_plan_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
    networks:
      - app-net

  app:
    image: 10.4.102.212:8080/pmma-plan:latest
    container_name: pmma_plan_app
    restart: unless-stopped
    ports:
      - "9000:3000"
    environment:
      PORT: 3000
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    external: true
