
services:
  pmma:
    image: 10.4.102.212:8080/pmma:latest
    container_name: pmma
    restart: unless-stopped
    # พอร์ตบน host: เลี่ยงชนกับ tccstock_nginx (ใช้ 80) และ docker-registry (ใช้ 8080->5000)
    # เข้าแอป: http://<host>:9000
    ports:
      - "9000:80"
    volumes:
      # Must match backend: path.join(__dirname, 'uploads') => /app/backend/uploads
      - /data/pmm/uploads:/app/backend/uploads
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: tccstock_mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
    networks:
      - app-net

networks:
  app-net:
    external: true
# ถ้า DB_HOST=tccstock_mysql resolve ไม่ได้: ให้คอนเทนเนอร์ mysql join network เดียวกัน เช่น
#   docker network connect app-net tccstock_mysql
