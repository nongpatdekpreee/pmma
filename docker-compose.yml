services:
  pmma:
    image: 10.4.102.212:8080/pmma:latest
    container_name: pmma
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - /data/pmm/uploads:/app/backend/uploads
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: tccstock_mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
    networks:
      - app-net

networks:
  app-net:
    external: true