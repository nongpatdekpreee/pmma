version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: tccstock_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: tccuser
      MYSQL_PASSWORD: tccpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./TccStock (1).sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tccstock_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tccstock_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: tccuser
      DB_PASSWORD: tccpassword
      DB_NAME: app_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tccstock_network
    volumes:
      - ./:/app
      - /app/node_modules

networks:
  tccstock_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

